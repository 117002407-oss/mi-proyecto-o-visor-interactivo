     ========================================================= */
  function viewLesson() {
    return '<div class="wrap lesson-grid">' + viewLectio(mod()) + viewChallenge() + '</div>';
  }
  function viewLectio(m) {
    const L = m.lectio;
    const lines = L.lines.map(l => '<li><span class="la">' + l[0] + '</span><span class="es">' + l[1] + '</span></li>').join('');
    const caps = L.capsula.map(c => '<p><span class="k' + (c[0] === 'Iūs' ? ' ius' : '') + '">' + c[0] + '</span><span>' + c[1] + '</span></p>').join('');
    const head = L.table.head.map(h => '<th scope="col">' + h + '</th>').join('');
    const rows = L.table.rows.map(r => '<tr' + (r[4] ? ' class="hl"' : '') + '><th scope="row">' + r[0] + '</th><td>' + r[1] + '</td><td>' + r[2] + '</td><td>' + r[3] + '</td></tr>').join('');
    return '<aside class="lectio card' + (state.showVersio ? ' show-versio' : '') + '" id="lectio">' +
      '<button class="lectio-head" type="button" data-action="toggle-lectio" aria-expanded="' + state.lectioOpen + '" aria-controls="lectioBody">' +
        '<span><span class="k">Micro-Lēctiō · ' + m.capitulum + '</span><span class="t">' + L.heading + '</span></span>' + ICON.chevron +
      '</button>' +
      '<div class="lectio-body' + (state.lectioOpen ? '' : ' collapsed') + '" id="lectioBody">' +
        '<ol class="lectio-text">' + lines + '</ol>' +
        '<div class="versio-row"><span>Ørberg enseña sin traducir: deduce el sentido por el contexto.</span>' +
          '<button class="toggle" type="button" data-action="toggle-versio" aria-pressed="' + state.showVersio + '"><span class="dot"></span>Versiō</button></div>' +
        '<div class="capsula">' + caps + '</div>' +
        '<div class="decl-wrap"><table class="decl"><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '</div></aside>';
  }
  function viewChallenge() {
    const item = cur();
    if (!item) return '<section id="challenge" class="challenge card"></section>';
    const q = item.q;
    let body = '';
    if (q.type === 'mc') body = viewMC(q);
    else if (q.type === 'fill') body = viewFill(q);
    else if (q.type === 'match') body = viewMatch(q);
    else if (q.type === 'type') body = viewType(q);
    const n = Math.min(state.done + 1, state.total);
    return '<section id="challenge" class="challenge card" aria-live="polite">' +
      '<div class="q-top"><span class="tag tag-' + q.kind + '">' + q.tag + '</span>' +
        (item.retry ? '<span class="tag tag-retry">Iterum · repaso</span>' : '') +
        '<span class="qcount">Quaestiō ' + n + ' / ' + state.total + '</span></div>' +
      '<h2 class="prompt">' + q.prompt + '</h2>' + body + '</section>';
  }
  function tablet(latin, lbl) {
    return '<div class="tablet"><span class="lbl">' + (lbl || 'Textus') + '</span><p class="latin-line">' + latin.replace('____', '<span class="gap">____</span>') + '</p></div>';
  }
  function viewMC(q) {
    const ui = state.ui;
    if (!ui.order) ui.order = shuffle(q.options.map((_, i) => i));
    const fb = state.phase === 'feedback';
    const two = q.options.every(o => o.length <= 24);
    const opts = ui.order.map((oi, k) => {
      let cls = 'opt' + (q.latinOptions ? ' latin' : '');
      if (fb) {
        if (oi === q.answer) cls += ' is-ok';
        else if (oi === ui.sel) cls += ' is-bad';
        else cls += ' is-dim';
      } else if (oi === ui.sel) cls += ' is-selected';
      return '<button class="' + cls + '" type="button" data-action="mc" data-i="' + oi + '"' + (fb ? ' disabled' : '') + ' aria-pressed="' + (oi === ui.sel) + '">' +
        '<span class="opt-key">' + (k + 1) + '</span><span class="opt-text">' + q.options[oi] + '</span></button>';
    }).join('');
    return tablet(q.latin) + '<div class="opts' + (two ? ' two' : '') + '" role="group" aria-label="Opciones">' + opts + '</div>';
  }
  function viewFill(q) {
    const ui = state.ui, fb = state.phase === 'feedback';
    if (!ui.fills) ui.fills = q.answers.map(() => null);
    if (!ui.bankOrder) ui.bankOrder = shuffle(q.bank.map((_, i) => i));
    let slot = 0;
    const sentence = q.parts.map(p => {
      if (p !== '_') return '<span>' + p + '</span>';
      const i = slot++, bi = ui.fills[i];
      let cls = 'slot';
      if (fb) cls += (bi != null && q.bank[bi] === q.answers[i]) ? ' is-ok' : ' is-bad';
      else if (bi == null) cls += ' is-empty';
      const label = bi == null ? 'Hueco vacío' : 'Quitar ' + q.bank[bi];
      return '<button class="' + cls + '" type="button" data-action="slot" data-i="' + i + '" aria-label="' + label + '"' + (fb || bi == null ? ' disabled' : '') + '>' + (bi == null ? '&nbsp;' : q.bank[bi]) + '</button>';
    }).join('');
    const used = new Set(ui.fills.filter(x => x != null));
    const bank = ui.bankOrder.map(bi => '<button class="tile' + (used.has(bi) ? ' is-used' : '') + '" type="button" data-action="bank" data-i="' + bi + '"' + (used.has(bi) || fb ? ' disabled' : '') + '>' + q.bank[bi] + '</button>').join('');
    return '<div class="tablet"><span class="lbl">Textus</span><p class="latin-line">' + sentence + '</p>' + (q.gloss ? '<p class="gloss">' + q.gloss + '</p>' : '') + '</div>' +
      '<div><span class="match-hint">Banco de desinencias: toca una para colocarla en el hueco.</span><div class="bank" role="group" aria-label="Banco de palabras">' + bank + '</div></div>';
  }
  function viewMatch(q) {
    const ui = state.ui, fb = state.phase === 'feedback';
    if (!ui.rightOrder) ui.rightOrder = shuffle(q.pairs.map((_, i) => i));
    if (!ui.pairs) ui.pairs = {};
    const r2l = {};
    Object.keys(ui.pairs).forEach(l => { r2l[ui.pairs[l]] = +l; });
    const left = q.pairs.map((p, i) => {
      const paired = ui.pairs[i] != null;
      let cls = 'mitem left';
      if (fb) cls += ui.pairs[i] === i ? ' is-ok' : ' is-bad';
      else if (ui.leftSel === i) cls += ' is-active';
      if (paired) cls += ' paired c' + i;
      return '<button class="' + cls + '" type="button" data-action="left" data-i="' + i + '"' + (fb ? ' disabled' : '') + '><span class="badge">' + (paired ? ROMAN[i] : '') + '</span><span>' + p[0] + '</span></button>';
    }).join('');
    const right = ui.rightOrder.map(ri => {
      const l = r2l[ri];
      const paired = l != null;
      let cls = 'mitem right';
      if (fb) cls += l === ri ? ' is-ok' : ' is-bad';
      else if (ui.rightSel === ri) cls += ' is-active';
      if (paired) cls += ' paired c' + l;
      return '<button class="' + cls + '" type="button" data-action="right" data-i="' + ri + '"' + (fb ? ' disabled' : '') + '><span class="badge">' + (paired ? ROMAN[l] : '') + '</span><span>' + q.pairs[ri][1] + '</span></button>';
    }).join('');
    const hint = fb ? '' : '<p class="match-hint">Toca un término latino y después su análisis. Toca un par ya formado para deshacerlo.</p>';
    return hint + '<div class="match"><div class="match-col"><span class="col-lbl">Latīnē</span>' + left + '</div><div class="match-col"><span class="col-lbl">Casus / análisis</span>' + right + '</div></div>';
  }
  function viewType(q) {
    const ui = state.ui, fb = state.phase === 'feedback';
    let cls = 'type-input';
    if (fb) cls += state.lastResult.status === 'correct' ? ' is-ok' : state.lastResult.status === 'near' ? ' is-near' : ' is-bad';
    return tablet(q.latin) + (q.hint ? '<p class="gloss" style="margin-top:-.4rem">' + q.hint + '</p>' : '') +
      '<label for="typeInput" class="sr-only">Tu respuesta en latín</label>' +
      '<input id="typeInput" class="' + cls + '" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Scrībe hīc…" value="' + esc(ui.typed || '') + '"' + (fb ? ' disabled' : '') + '>' +
      '<p class="type-help">Usa el teclado de macrones de abajo o escribe la vocal seguida de <kbd>=</kbd> (a= → ā).</p>';
  }

  /* =========================================================
     GENERADOR DE PARADIGMAS (preguntas que no se repiten)
     ========================================================= */
  function declOf(lemma) { if (lemma.endsWith('us')) return 'm'; if (lemma.endsWith('um')) return 'n'; return 'f'; }
  function formOf(w, c, n) {
    const d = declOf(w.lemma);
    return w.lemma.slice(0, d === 'f' ? -1 : -2) + ENDINGS[d][c][n];
  }
  function labelOf(key) { const c = key.slice(0, 3), n = +key[3]; return CASES[c].charAt(0).toUpperCase() + CASES[c].slice(1) + ' ' + NUMS[n]; }
  function paradigmLine(w, cases) {
    return cases.map(c => CASES[c].slice(0, 3) + '. ' + formOf(w, c, 0) + ' / ' + formOf(w, c, 1)).join(' · ');
  }
  function generateQuestion(mi, used, onlyMC) {
    const cases = TAUGHT[mi];
    let w, c, n, form, tries = 0;
    do {
      w = pick(LEXICON); c = pick(cases); n = Math.random() < 0.5 ? 0 : 1; form = formOf(w, c, n); tries++;
    } while (used && used.has(w.lemma) && tries < 40);
    if (used) used.add(w.lemma);
    const d = declOf(w.lemma), key = c + n;
    const valid = [];
    cases.forEach(cc => [0, 1].forEach(nn => { if (formOf(w, cc, nn) === form) valid.push(cc + nn); }));
    const others = valid.filter(k => k !== key);
    const ambig = others.length ? ' Atención: <i class="la">' + form + '</i> también puede ser ' + others.map(k => labelOf(k).toLowerCase()).join(' o ') + '; el contexto decide.' : '';
    const explain = '<i class="la">' + w.lemma + '</i> («' + w.es + '»), ' + DECL_LABEL[d] + ': ' + CASES[c] + ' ' + NUMS[n] + ' en <b>-' + ENDINGS[d][c][n] + '</b> → <i class="la">' + form + '</i>.' + ambig +
      '<span class="para la">' + paradigmLine(w, cases) + '</span>';
    const base = { generated: true, tag: 'Paradigma', kind: 'morph', explain: explain };
    const mode = onlyMC ? pick(['produce', 'identify']) : pick(['type', 'produce', 'identify']);
    if (mode === 'type') {
      return Object.assign(base, {
        type: 'type', prompt: 'Escribe el ' + CASES[c] + ' ' + NUMS[n] + ' de «' + w.lemma + '».',
        latin: w.lemma + ' → ____', hint: '«' + w.es + '» · ' + DECL_LABEL[d], answers: [form]
      });
    }
    if (mode === 'produce') {
      const all = [];
      ['nom', 'gen', 'acc', 'abl'].forEach(cc => [0, 1].forEach(nn => { const f = formOf(w, cc, nn); if (f !== form && !all.includes(f)) all.push(f); }));
      const taughtForms = all.filter(f => cases.some(cc => [0, 1].some(nn => formOf(w, cc, nn) === f)));
      let distract = shuffle(taughtForms).slice(0, 3);
      if (distract.length < 3) distract = distract.concat(shuffle(all.filter(f => !distract.includes(f))).slice(0, 3 - distract.length));
      return Object.assign(base, {
        type: 'mc', latinOptions: true, prompt: '¿Cuál es el ' + CASES[c] + ' ' + NUMS[n] + ' de «' + w.lemma + '»?',
        latin: w.lemma + ' · «' + w.es + '»', options: [form].concat(distract), answer: 0
      });
    }
    const keys = [];
    cases.forEach(cc => [0, 1].forEach(nn => keys.push(cc + nn)));
    const distract = shuffle(keys.filter(k => !valid.includes(k))).slice(0, 3);
    return Object.assign(base, {
      type: 'mc', prompt: '¿Qué caso y número puede ser «' + form + '»?',
      latin: form + ' · de ' + w.lemma, options: [labelOf(key)].concat(distract.map(labelOf)), answer: 0
    });
  }

  /* Selección de la sesión: falladas → no vistas → vistas hace más tiempo */
  function tierOf(q) { return state.missed[q.id] ? 0 : state.seen[q.id] == null ? 1 : 2; }
  function buildSession(mi) {
    state.sessionNo++;
    const bank = MODULES[mi].questions;
    const ordered = shuffle(bank).sort((a, b) => tierOf(a) - tierOf(b) || ((state.seen[a.id] || 0) - (state.seen[b.id] || 0)));
    const picked = [];
    ordered.filter(q => tierOf(q) === 0).slice(0, 2).forEach(q => picked.push(q));
    ['fill', 'match', 'type', 'mc'].forEach(t => {
      if (picked.length >= SESSION_CURATED || picked.some(p => p.type === t)) return;
      const c = ordered.find(q => q.type === t && !picked.includes(q) && tierOf(q) < 2);
      if (c) picked.push(c);
    });
    for (const q of ordered) { if (picked.length >= SESSION_CURATED) break; if (!picked.includes(q)) picked.push(q); }
    picked.forEach(q => { state.seen[q.id] = state.sessionNo; });
    const used = new Set();
    const gens = [];
    for (let k = 0; k < SESSION_GENERATED; k++) gens.push(generateQuestion(mi, used, false));
    return shuffle(picked.concat(gens));
  }
  function bankStats(mi) {
    const bank = MODULES[mi].questions;
    return {
      total: bank.length,
      seen: bank.filter(q => state.seen[q.id] != null).length,
      missed: bank.filter(q => state.missed[q.id]).length
    };
  }

  /* =========================================================
     LÓGICA DE LA LECCIÓN
     ========================================================= */
  function startModule(i) {
    state.currentModuleIndex = i;
    state.currentQuestionIndex = 0;
    state.queue = buildSession(i).map((q, k) => ({ q: q, key: k, retry: false }));
    state.done = 0;
    state.total = state.queue.length;
    if (state.lives <= 0) state.lives = 5;
    state.stats = { correct: 0, near: 0, wrong: 0, xpStart: state.xp, rankStart: rankIndex(state.xp), maxStreak: state.streak, bonus: [] };
    state.phase = 'question';
    state.ui = {};
    state.lastResult = null;
    state.lectioOpen = true;
    state.screen = 'lesson';
    sfx('tap');
    render();
    window.scrollTo({ top: 0 });
  }
  function canCheck() {
    const item = cur(); if (!item) return false;
    const q = item.q, ui = state.ui;
    if (q.type === 'mc') return ui.sel != null;
    if (q.type === 'fill') return !!ui.fills && ui.fills.every(x => x != null);
    if (q.type === 'match') return !!ui.pairs && Object.keys(ui.pairs).length === q.pairs.length;
    if (q.type === 'type') return !!(ui.typed && ui.typed.trim());
    return false;
  }
  function evaluate(q) {
    const ui = state.ui;
    if (q.type === 'mc') return ui.sel === q.answer ? 'correct' : 'wrong';
    if (q.type === 'fill') return q.answers.every((a, i) => q.bank[ui.fills[i]] === a) ? 'correct' : 'wrong';
    if (q.type === 'match') return q.pairs.every((_, i) => ui.pairs[i] === i) ? 'correct' : 'wrong';
    if (q.type === 'type') {
      const t = norm(ui.typed || '');
      if (q.answers.some(a => norm(a) === t)) return 'correct';
      if (q.answers.some(a => stripMarks(norm(a)) === stripMarks(t))) return 'near';
      return 'wrong';
    }
    return 'wrong';
  }
  function correctAnswerHTML(q) {
    if (q.type === 'mc') return '<span class="' + (q.latinOptions ? 'la' : '') + '">' + q.options[q.answer] + '</span>';
    if (q.type === 'fill') { let k = 0; return '<span class="la">' + q.parts.map(p => p === '_' ? '<u>' + q.answers[k++] + '</u>' : p).join('') + '</span>'; }
    if (q.type === 'match') return q.pairs.map(p => '<span class="la">' + p[0] + '</span> → ' + p[1]).join(' · ');
    if (q.type === 'type') return '<span class="la">' + q.answers[0] + '</span>';
    return '';
  }
  function check() {
    if (state.phase !== 'question' || !canCheck()) return;
    const item = cur(), q = item.q;
    const status = evaluate(q);
    const prevLives = state.lives;
    let gain = 0;
    if (status === 'correct') {
      state.streak++;
      gain = 10 + (state.streak >= 3 ? 5 : 0);
      state.stats.correct++;
      state.done++;
      sfx('ok');
    } else if (status === 'near') {
      gain = 5;
      state.stats.near++;
      state.done++;
      sfx('near');
    } else {
      state.streak = 0;
      state.lives = Math.max(0, state.lives - 1);
      state.stats.wrong++;
      state.queue.push({ q: q, key: item.key, retry: true });
      sfx('err');
    }
    if (q.id) {
      if (status === 'wrong') state.missed[q.id] = true;
      else if (!item.retry) delete state.missed[q.id];
    }
    state.stats.maxStreak = Math.max(state.stats.maxStreak, state.streak);
    if (gain) { state.xp += gain; floatXP(gain); }
    state.lastResult = { status: status, gain: gain, q: q };
    state.phase = 'feedback';
    save();
    renderChallenge();
    updateHeader(prevLives);
  }
  function next() {
    if (state.phase !== 'feedback') return;
    if (state.lives <= 0) { startTribunal(); return; }
    advance();
  }
  function advance() {
    state.currentQuestionIndex++;
    if (state.lectioOpen && window.innerWidth < 768) state.lectioOpen = false;
    if (state.currentQuestionIndex >= state.queue.length) { finishModule(); return; }
    state.phase = 'question';
    state.ui = {};
    state.lastResult = null;
    if (state.screen !== 'lesson') { state.screen = 'lesson'; render(); }
    else {
      const body = $('#lectioBody');
      if (body) body.classList.toggle('collapsed', !state.lectioOpen);
      const head = $('.lectio-head');
      if (head) head.setAttribute('aria-expanded', state.lectioOpen);
      renderChallenge();
    }
    if (window.innerWidth < 768) { const c = $('#challenge'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  }
  function finishModule() {
    const i = state.currentModuleIndex, st = state.stats;
    let bonus = 20;
    const lines = ['+20 XP por completar el capítulo'];
    if (st.wrong === 0 && st.near === 0) { bonus += 10; lines.push('+10 XP <i class="la">sine errōre</i> (sin errores)'); }
    state.xp += bonus;
    const attempts = st.correct + st.near + st.wrong;
    const acc = attempts ? Math.round((st.correct + st.near * 0.5) / attempts * 100) : 100;
    const lifeBack = state.lives < 5;
    state.lives = Math.min(5, state.lives + 1);
    if (lifeBack) lines.push('+1 <i class="la">vīta</i> de premio');
    if (!state.completed.includes(i)) state.completed.push(i);
    state.unlocked = Math.max(state.unlocked, Math.min(MODULES.length, i + 2));
    state.best[i] = Math.max(state.best[i] || 0, acc);
    const bs = bankStats(i);
    lines.push('Banco del capítulo: ' + bs.seen + ' de ' + bs.total + ' preguntas vistas' + (bs.missed ? ' · ' + bs.missed + ' volverán en tu próxima sesión para repasarlas' : ''));
    const rankEnd = rankIndex(state.xp);
    state.victory = {
      i: i, correct: st.correct, near: st.near, wrong: st.wrong, acc: acc,
      xpGained: state.xp - st.xpStart, maxStreak: st.maxStreak, lives: state.lives,
      promoted: rankEnd > st.rankStart ? RANKS[rankEnd] : null, bonusLines: lines
    };
    state.screen = 'victory';
    save();
    sfx('win');
    render();
    floatXP(bonus);
    window.scrollTo({ top: 0 });
  }

  /* =========================================================
     VISTA: VICTORIA
     ========================================================= */
  function viewVictory() {
    const v = state.victory, m = MODULES[v.i];
    const last = v.i === MODULES.length - 1;
    const promo = v.promoted ? '<div class="promo">' + LAUREL + '<div><span class="eyebrow" style="color:var(--gold)">Novus gradus</span><div class="name">' + v.promoted.name + '</div><div style="font-size:.85rem">Ahora eres ' + v.promoted.es + '.</div></div></div>' : '';
    const stat = (k, es, val, gold) => '<div class="stat' + (gold ? ' gold' : '') + '"><div class="k">' + k + ' <span class="es">· ' + es + '</span></div><div class="v">' + val + '</div></div>';
    const nextBtn = last
      ? '<button class="btn btn-gold" type="button" data-action="go-map">Cursum perfēcistī · Ver mapa</button>'
      : '<button class="btn btn-primary" type="button" data-action="start" data-i="' + (v.i + 1) + '">Capitulum ' + MODULES[v.i + 1].numeral + ' · Pergere</button>';
    return '<div class="wrap narrow"><div class="card center-card">' +
      '<div class="victory-head">' +
        '<div class="wreath">' + LAUREL + '<span class="num">' + m.numeral + '</span></div>' +
        '<p class="eyebrow">' + m.capitulum + ' perfectum</p>' +
        '<h1 class="display">Victōria!</h1>' +
        '<p class="la" style="font-size:1.15rem;color:var(--ink-2)">' + m.title + '</p>' +
      '</div>' + promo +
      '<div class="stat-grid">' +
        stat('Rēctē', 'aciertos', v.correct + (v.near ? ' <span style="font-size:1rem;color:var(--amber-700)">+' + v.near + ' ferē</span>' : '')) +
        stat('Errāta', 'errores', v.wrong) +
        stat('Accūrātiō', 'precisión', v.acc + '%') +
        stat('XP', 'ganada', '+' + v.xpGained, true) +
        stat('Seriēs maxima', 'mejor racha', v.maxStreak) +
        stat('Vītae', 'vidas', v.lives + ' / 5') +
      '</div>' +
      '<div class="bonus">' + v.bonusLines.map(l => '<span>' + l + '</span>').join('') + '</div>' +
      '<div class="actions"><button class="btn btn-ghost" type="button" data-action="go-map">Cursus Honōrum</button>' + nextBtn + '</div>' +
    '</div></div>';
  }

  /* =========================================================
     TRIBŪNAL DĒ RECUPERĀTIŌNE
     ========================================================= */
  function startTribunal() {
    let fresh = TRIBUNAL_POOL.filter(t => !state.tribSeen.includes(t.id));
    if (fresh.length < 2) { state.tribSeen = []; fresh = TRIBUNAL_POOL.slice(); }
    const drawn = shuffle(fresh).slice(0, 2);
    drawn.forEach(t => state.tribSeen.push(t.id));
    const g = generateQuestion(state.currentModuleIndex, null, true);
    drawn.push({ q: g.prompt, latin: !!g.latinOptions, options: g.options, answer: g.answer, explain: g.explain });
    save();
    const qs = shuffle(drawn).map(t => Object.assign({}, t, { order: shuffle(t.options.map((_, i) => i)) }));
    state.tribunal = { qs: qs, i: 0, correct: 0, answered: null, results: [], verdict: null };
    state.screen = 'tribunal';
    sfx('gavel');
    render();
    window.scrollTo({ top: 0 });
  }
  function viewTribunal() {
    const t = state.tribunal;
    const dots = [0, 1, 2].map(k => {
      const r = t.results[k];
      const cls = r === true ? 'ok' : r === false ? 'bad' : k === t.i && !t.verdict ? 'now' : '';
      return '<span class="' + cls + '">' + ROMAN[k] + '</span>';
    }).join('');
    const head = '<div class="tribunal-head">' + ICON.scales + '<div><p class="eyebrow" style="color:var(--gold)">Iūdicium</p><h1>Tribūnal dē Recuperātiōne</h1>' +
      '<p>Has agotado tus <i class="la">vītae</i>. Responde tres preguntas rápidas: con dos aciertos quedas absuelto y recuperas tres vidas.</p></div></div>';
    let body = '';
    if (t.verdict === 'abs') {
      body = '<div class="verdict abs"><div class="wreath" style="width:110px;height:110px">' + LAUREL + '</div><h2 class="la">Absolūtus!</h2>' +
        '<p>Acertaste ' + t.correct + ' de 3. El tribunal te devuelve <b>3 <i class="la">vītae</i></b>.</p></div>' +
        '<div class="actions"><button class="btn btn-primary" type="button" data-action="trib-resume">Pergere · Volver a la lección</button></div>';
    } else if (t.verdict === 'dam') {
      body = '<div class="verdict dam"><h2 class="la">Damnātus</h2><p>Acertaste ' + t.correct + ' de 3; necesitas dos. Puedes pedir un nuevo juicio o repetir el capítulo desde el principio.</p></div>' +
        '<div class="actions"><button class="btn btn-primary" type="button" data-action="trib-retry">Novum iūdicium</button>' +
        '<button class="btn btn-ghost" type="button" data-action="restart">Capitulum dē integrō</button>' +
        '<button class="btn btn-ghost" type="button" data-action="go-map">Cursus Honōrum</button></div>';
    } else {
      const q = t.qs[t.i];
      const opts = q.order.map((oi, k) => {
        let cls = 'opt' + (q.latin ? ' latin' : '');
        if (t.answered != null) {
          if (oi === q.answer) cls += ' is-ok';
          else if (oi === t.answered) cls += ' is-bad';
          else cls += ' is-dim';
        }
        return '<button class="' + cls + '" type="button" data-action="trib" data-i="' + oi + '"' + (t.answered != null ? ' disabled' : '') + '><span class="opt-key">' + (k + 1) + '</span><span class="opt-text">' + q.options[oi] + '</span></button>';
      }).join('');
      body = '<div class="q-top"><span class="tag tag-ius">Quaestiō ' + ROMAN[t.i] + '</span><span class="qcount">' + (t.i + 1) + ' / 3</span></div>' +
        '<h2 class="prompt' + (q.latin ? ' la' : '') + '">' + q.q + '</h2>' +
        '<div class="opts' + (q.options.every(o => o.length <= 24) ? ' two' : '') + '">' + opts + '</div>' +
        (t.answered != null
          ? '<p class="trib-explain"><b>' + (t.answered === q.answer ? 'Rēctē.' : 'Nōn rēctē.') + '</b> ' + q.explain + '</p>' +
            '<div class="actions"><button class="btn btn-primary" type="button" data-action="trib-next">' + (t.i < 2 ? 'Sequēns · Siguiente' : 'Sententia · Veredicto') + '</button></div>'
          : '');
    }
    return '<div class="wrap narrow" style="display:grid;gap:1rem">' + head +
      '<div class="card center-card"><div class="dots" aria-label="Preguntas del tribunal">' + dots + '</div>' + body + '</div></div>';
  }
  function tribAnswer(oi) {
    const t = state.tribunal;
    if (t.answered != null || t.verdict) return;
    const q = t.qs[t.i];
    t.answered = oi;
    const ok = oi === q.answer;
    t.results[t.i] = ok;
    if (ok) { t.correct++; sfx('ok'); } else sfx('err');
    render();
  }
  function tribNext() {
    const t = state.tribunal;
    if (t.answered == null) return;
    if (t.i < 2) { t.i++; t.answered = null; render(); return; }
    t.verdict = t.correct >= 2 ? 'abs' : 'dam';
    if (t.verdict === 'abs') { state.lives = 3; save(); sfx('win'); } else sfx('gavel');
    render();
  }

  /* =========================================================
     THĒSAURUS: banco de preguntas consultable
     ========================================================= */
  function plain(s) { return stripMarks(String(s || '').replace(/<[^>]+>/g, ' ')).toLowerCase(); }
  function qText(q) {
    return plain([q.prompt, q.q, q.latin, (q.parts || []).join(''), (q.options || []).join(' '),
      (q.pairs || []).map(p => p.join(' ')).join(' '), (q.answers || []).join(' '), q.explain].join(' '));
  }
  function viewThesaurus() {
    const tabs = MODULES.map((m, i) => ({ id: String(i), label: 'Cap. ' + m.numeral, n: m.questions.length }))
      .concat([{ id: 'trib', label: 'Tribūnal', n: TRIBUNAL_POOL.length }, { id: 'voc', label: 'Vocābulārium', n: LEXICON.length }]);
    const seg = tabs.map(t => '<button class="seg-btn" type="button" role="tab" data-action="thes-tab" data-tab="' + t.id + '" aria-selected="' + (state.thesTab === t.id) + '">' + t.label + ' <span class="n">' + t.n + '</span></button>').join('');
    return '<div class="wrap">' +
      '<section class="hero">' +
        '<p class="eyebrow">Thēsaurus quaestiōnum</p>' +
        '<h1 class="display">Banco de preguntas</h1>' +
        '<p class="lede">Todas las preguntas del curso con su respuesta y su explicación. Intenta responder antes de abrir el <i class="la">respōnsum</i>. Las marcadas como <b>repetenda</b> son las que fallaste: volverán en tu próxima sesión.</p>' +
        '<div class="hero-actions"><button class="btn btn-ghost btn-sm" type="button" data-action="go-map">Volver al Cursus Honōrum</button></div>' +
      '</section>' +
      '<div class="thes-bar"><div class="seg" role="tablist" aria-label="Secciones del banco">' + seg + '</div>' +
        '<label class="search"><span class="sr-only">Buscar en el banco</span><input id="thesQuery" type="search" autocomplete="off" spellcheck="false" placeholder="Buscar: genitivo, pacta, ancilla… (con o sin macrones)" value="' + esc(state.thesQuery) + '"></label></div>' +
      '<div id="thesList" class="thes-list">' + thesListHTML() + '</div></div>';
  }
  function thesListHTML() {
    const query = plain(state.thesQuery).trim();
    const tab = state.thesTab;
    if (tab === 'voc') return vocabHTML(query);
    const isTrib = tab === 'trib';
    let items = isTrib ? TRIBUNAL_POOL : MODULES[+tab].questions;
    const total = items.length;
    if (query) items = items.filter(q => qText(q).includes(query));
    let summary;
    if (isTrib) summary = total + ' preguntas rápidas. El tribunal toma 2 que aún no te hayan salido y genera 1 de declinación.';
    else { const bs = bankStats(+tab); summary = MODULES[+tab].title + ': ' + bs.seen + ' de ' + bs.total + ' vistas' + (bs.missed ? ' · ' + bs.missed + ' por repasar' : '') + '. Además, cada sesión genera ' + SESSION_GENERATED + ' ejercicios de declinación con el Vocābulārium.'; }
    const head = '<p class="thes-summary">' + summary + (query ? ' Coinciden ' + items.length + '.' : '') + '</p>';
    if (!items.length) return head + '<p class="muted thes-empty">Ninguna pregunta coincide con «' + esc(state.thesQuery) + '». Prueba con otra palabra.</p>';
    return head + items.map(q => isTrib ? tribCard(q) : qCard(q)).join('');
  }
  function stemOf(q) {
    if (q.type === 'fill') return q.parts.map(p => p === '_' ? '<span class="blank">___</span>' : p).join('');
    if (q.type === 'match') return q.pairs.map(p => p[0]).join(' · ');
    return (q.latin || '').replace('____', '<span class="blank">___</span>');
  }
  const TYPE_LABEL = { mc: 'Opción múltiple', fill: 'Completar', match: 'Relacionar', type: 'Escribir' };
  function qCard(q) {
    const st = state.missed[q.id] ? ['rep', 'Repetenda · por repasar'] : state.seen[q.id] != null ? ['vis', 'Vīsa'] : ['nov', 'Nōndum vīsa'];
    return '<article class="entry card">' +
      '<div class="q-top"><span class="tag tag-' + q.kind + '">' + q.tag + '</span><span class="st st-' + st[0] + '">' + st[1] + '</span><span class="qcount">' + TYPE_LABEL[q.type] + '</span></div>' +
      '<h3 class="entry-q">' + q.prompt + '</h3>' +
      '<p class="entry-la la">' + stemOf(q) + '</p>' +
      (q.type === 'mc' ? '<ol class="entry-opts">' + sortedOpts(q.options).map(o => '<li' + (q.latinOptions ? ' class="la"' : '') + '>' + o + '</li>').join('') + '</ol>' : '') +
      '<details><summary>Respōnsum · ver respuesta</summary><p class="entry-a">' + correctAnswerHTML(q) + '</p><p class="entry-x">' + q.explain + '</p></details>' +
    '</article>';
  }
  function sortedOpts(o) { return o.slice().sort((a, b) => stripMarks(a).localeCompare(stripMarks(b), 'es')); }
  function tribCard(t) {
    const st = state.tribSeen.includes(t.id) ? ['vis', 'Vīsa'] : ['nov', 'Nōndum vīsa'];
    return '<article class="entry card">' +
      '<div class="q-top"><span class="tag tag-ius">Tribūnal</span><span class="st st-' + st[0] + '">' + st[1] + '</span></div>' +
      '<h3 class="entry-q' + (t.latin ? ' la' : '') + '">' + t.q + '</h3>' +
      '<ol class="entry-opts">' + sortedOpts(t.options).map(o => '<li' + (t.latin ? ' class="la"' : '') + '>' + o + '</li>').join('') + '</ol>' +
      '<details><summary>Respōnsum · ver respuesta</summary><p class="entry-a"><span class="' + (t.latin ? 'la' : '') + '">' + t.options[t.answer] + '</span></p><p class="entry-x">' + t.explain + '</p></details>' +
    '</article>';
  }
  function vocabHTML(query) {
    let words = LEXICON;
    if (query) words = words.filter(w => plain(w.lemma + ' ' + w.es).includes(query));
    const rows = words.map(w => {
      const d = declOf(w.lemma);
      return '<tr><th scope="row" class="la">' + w.lemma + '</th><td>' + w.es + '</td><td class="dl">' + DECL_LABEL[d] + '</td>' +
        ['nom', 'gen', 'acc', 'abl'].map(c => '<td class="la">' + formOf(w, c, 0) + '<br><span class="pl">' + formOf(w, c, 1) + '</span></td>').join('') + '</tr>';
    }).join('');
    return '<p class="thes-summary">' + LEXICON.length + ' sustantivos de la 1.ª y 2.ª declinación. Con ellos se generan los ejercicios de paradigma, así que casi nunca verás dos iguales. Arriba el singular, abajo el plural.</p>' +
      (words.length
        ? '<div class="voc-wrap card"><table class="decl voc"><thead><tr><th scope="col">Lemma</th><th scope="col">Significado</th><th scope="col">Declinación</th><th scope="col">Nōm.</th><th scope="col">Gen.</th><th scope="col">Acc.</th><th scope="col">Abl.</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : '<p class="muted thes-empty">Ninguna palabra coincide con «' + esc(state.thesQuery) + '».</p>');
  }

  /* =========================================================
     BARRA DE COMPROBACIÓN Y TECLADO
     ========================================================= */
  function updateCheckbar() {
    const bar = $('#checkbar'), btn = $('#btnCheck');
    if (state.screen !== 'lesson') return;
    if (state.phase === 'question') {
      bar.dataset.state = 'idle';
      $('#fb').hidden = true;
      $('#fbHint').hidden = false;
      btn.textContent = 'Probāre · Comprobar';
      btn.className = 'btn btn-primary btn-check';
      btn.disabled = !canCheck();
    } else {
      const r = state.lastResult, q = r.q;
      bar.dataset.state = r.status;
      $('#fb').hidden = false;
      $('#fbHint').hidden = true;
      $('#fbIcon').innerHTML = r.status === 'correct' ? ICON.check : r.status === 'near' ? ICON.tilde : ICON.cross;
      if (r.status === 'correct') {
        $('#fbTitle').innerHTML = '<span class="la">' + pick(PRAISE) + '</span> +' + r.gain + ' XP';
        $('#fbAnswer').innerHTML = q.type === 'mc' ? '' : correctAnswerHTML(q);
        $('#fbExplain').innerHTML = q.explain;
      } else if (r.status === 'near') {
        $('#fbTitle').innerHTML = '<span class="la">Ferē rēctē</span> · +' + r.gain + ' XP';
        $('#fbAnswer').innerHTML = 'Se escribe: ' + correctAnswerHTML(q);
        $('#fbExplain').innerHTML = 'Acertaste la palabra, pero no la cantidad vocálica. En latín la vocal larga cambia el caso: <i class="la">rosa</i> (nominativo) ≠ <i class="la">rosā</i> (ablativo). ' + q.explain;
      } else {
        $('#fbTitle').innerHTML = '<span class="la">' + pick(BLAME) + '</span>' + (state.lives <= 0 ? ' · sin vidas' : '');
        $('#fbAnswer').innerHTML = 'Respuesta correcta: ' + correctAnswerHTML(q);
        $('#fbExplain').innerHTML = q.explain + (state.lives <= 0 ? ' <b>Al continuar comparecerás ante el Tribūnal dē Recuperātiōne.</b>' : ' Esta pregunta volverá al final de la lección.');
      }
      btn.textContent = state.lives <= 0 ? 'Ad tribūnal · Continuar' : 'Pergere · Continuar';
      btn.className = 'btn btn-check btn-' + r.status;
      btn.disabled = false;
    }
    syncLayout();
  }
  function updateKeyboard() {
    const item = cur();
    const show = state.screen === 'lesson' && state.phase === 'question' && item && item.q.type === 'type';
    $('#macronKb').hidden = !show;
    document.body.classList.toggle('kb-on', !!show);
    const sh = $('#macronKb .shift');
    sh.setAttribute('aria-pressed', state.shift);
    document.querySelectorAll('#macronKb .kb-key[data-key]').forEach(b => {
      const k = b.dataset.key; if (k === 'shift') return;
      b.textContent = state.shift ? k.toUpperCase() : k.toLowerCase();
    });
  }
  function insertMacron(ch) {
    const inp = $('#typeInput');
    if (!inp || inp.disabled) return;
    const s = inp.selectionStart != null ? inp.selectionStart : inp.value.length;
    const e = inp.selectionEnd != null ? inp.selectionEnd : s;
    inp.value = inp.value.slice(0, s) + ch + inp.value.slice(e);
    inp.setSelectionRange(s + ch.length, s + ch.length);
    inp.focus();
    onTyped(inp);
    sfx('tap');
  }
  function onTyped(inp) {
    const before = inp.value;
    const pos = inp.selectionStart;
    const after = before.replace(/([aeiouAEIOU])=/g, (_, v) => MACRON[v]);
    if (after !== before) {
      inp.value = after;
      const np = Math.max(0, pos - (before.length - after.length));
      inp.setSelectionRange(np, np);
    }
    state.ui.typed = inp.value;
    $('#btnCheck').disabled = !canCheck();
  }

  /* =========================================================
     EVENTOS
     ========================================================= */
  document.addEventListener('click', function (e) {
    const a = e.target.closest('[data-action]');
    if (!a) {
      if (!e.target.closest('#heartsPop')) closeHearts();
      return;
    }
    const act = a.dataset.action;
    const i = a.dataset.i != null ? +a.dataset.i : null;
    if (act !== 'hearts') closeHearts();
    if (act !== 'reset' && state.resetArmed) state.resetArmed = false;
    switch (act) {
      case 'go-map': state.screen = 'map'; state.phase = 'question'; if (state.lives <= 0) state.lives = 5; render(); window.scrollTo({ top: 0 }); break;
      case 'start': startModule(i); break;
      case 'restart': state.lives = 5; startModule(state.currentModuleIndex); break;
      case 'hearts': {
        const pop = $('#heartsPop'); pop.hidden = !pop.hidden;
        a.setAttribute('aria-expanded', String(!pop.hidden));
        break;
      }
      case 'sound': state.sound = !state.sound; save(); updateHeader(); if (state.sound) sfx('tap'); break;
      case 'reset':
        if (!state.resetArmed) { state.resetArmed = true; render(); setTimeout(() => { if (state.resetArmed) { state.resetArmed = false; if (state.screen === 'map') render(); } }, 4000); }
        else {
          state.resetArmed = false; state.xp = 0; state.lives = 5; state.streak = 0; state.unlocked = 1; state.completed = []; state.best = {};
          state.seen = {}; state.missed = {}; state.sessionNo = 0; state.tribSeen = [];
          shownXP = 0; save(); render();
        }
        break;
      case 'toggle-lectio': {
        if (window.innerWidth >= 768) break;
        state.lectioOpen = !state.lectioOpen;
        $('#lectioBody').classList.toggle('collapsed', !state.lectioOpen);
        a.setAttribute('aria-expanded', state.lectioOpen);
        break;
      }
      case 'toggle-versio':
        state.showVersio = !state.showVersio;
        $('#lectio').classList.toggle('show-versio', state.showVersio);
        a.setAttribute('aria-pressed', state.showVersio);
        break;
      case 'mc':
        if (state.phase !== 'question') break;
        state.ui.sel = i; sfx('tap'); renderChallenge(); break;
      case 'bank': {
        if (state.phase !== 'question') break;
        const k = state.ui.fills.indexOf(null);
        if (k === -1) break;
        state.ui.fills[k] = i; sfx('tap'); renderChallenge(); break;
      }
      case 'slot':
        if (state.phase !== 'question') break;
        state.ui.fills[i] = null; renderChallenge(); break;
      case 'left': {
        if (state.phase !== 'question') break;
        const ui = state.ui;
        if (ui.rightSel != null) {
          const owner = Object.keys(ui.pairs).find(l => ui.pairs[l] === ui.rightSel);
          if (owner != null) delete ui.pairs[owner];
          ui.pairs[i] = ui.rightSel;
          ui.rightSel = null;
          ui.leftSel = null;
        } else if (ui.pairs[i] != null) { delete ui.pairs[i]; ui.leftSel = i; }
        else { ui.leftSel = i; ui.rightSel = null; }
        sfx('tap'); renderChallenge(); break;
      }
      case 'right': {
        if (state.phase !== 'question') break;
        const ui = state.ui;
        const owner = Object.keys(ui.pairs).find(l => ui.pairs[l] === i);
        if (ui.leftSel != null) {
          if (owner != null) delete ui.pairs[owner];
          ui.pairs[ui.leftSel] = i;
          ui.rightSel = null;
          const free = cur().q.pairs.map((_, k) => k).find(k => ui.pairs[k] == null);
          ui.leftSel = free != null ? free : null;
        } else if (owner != null) {
          delete ui.pairs[owner]; ui.leftSel = +owner;
        } else {
          ui.rightSel = i; ui.leftSel = null;
        }
        sfx('tap'); renderChallenge(); break;
      }
      case 'check':
        if (state.phase === 'question') check(); else next();
        break;
      case 'trib': tribAnswer(i); break;
      case 'trib-next': tribNext(); break;
      case 'trib-retry': startTribunal(); break;
      case 'trib-resume': advance(); break;
      case 'thes':
        if (a.dataset.tab != null) state.thesTab = a.dataset.tab;
        state.screen = 'thesaurus'; render(); window.scrollTo({ top: 0 }); break;
      case 'thes-tab':
        state.thesTab = a.dataset.tab; render(); break;
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'typeInput') onTyped(e.target);
    if (e.target && e.target.id === 'thesQuery') { state.thesQuery = e.target.value; $('#thesList').innerHTML = thesListHTML(); }
  });

  const kb = $('#macronKb');
  kb.addEventListener('pointerdown', function (e) { if (e.target.closest('.kb-key')) e.preventDefault(); });
  kb.addEventListener('mousedown', function (e) { if (e.target.closest('.kb-key')) e.preventDefault(); });
  kb.addEventListener('click', function (e) {
    const b = e.target.closest('.kb-key'); if (!b) return;
    if (b.dataset.key === 'shift') { state.shift = !state.shift; updateKeyboard(); const inp = $('#typeInput'); if (inp) inp.focus(); return; }
    insertMacron(b.textContent);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeHearts(); return; }
    if (state.screen === 'lesson') {
      if (e.key === 'Enter') {
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'button' && e.target.id !== 'btnCheck') return;
        e.preventDefault();
        if (state.phase === 'question') check(); else next();
        return;
      }
      const item = cur();
      if (state.phase === 'question' && item && item.q.type === 'mc' && /^[1-9]$/.test(e.key) && e.target.id !== 'typeInput') {
        const k = +e.key - 1;
        if (state.ui.order && k < state.ui.order.length) { state.ui.sel = state.ui.order[k]; sfx('tap'); renderChallenge(); }
      }
    } else if (state.screen === 'tribunal') {
      const t = state.tribunal;
      if (!t.verdict && t.answered == null && /^[1-9]$/.test(e.key)) {
        const q = t.qs[t.i], k = +e.key - 1;
        if (k < q.order.length) tribAnswer(q.order[k]);
      } else if (e.key === 'Enter' && t.answered != null && !t.verdict) { e.preventDefault(); tribNext(); }
    }
  });

  function closeHearts() {
    const pop = $('#heartsPop');
    if (!pop.hidden) { pop.hidden = true; $('#heartsBtn').setAttribute('aria-expanded', 'false'); }
  }

  if (window.ResizeObserver) {
    const ro = new ResizeObserver(syncLayout);
    ro.observe($('#topbar'));
    ro.observe($('#checkbar'));
  }
  window.addEventListener('resize', syncLayout);

  /* =========================================================
     ARRANQUE
     ========================================================= */
  load();
  shownXP = state.xp;
  render();
})();
</script>
</body>
</html>
